<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Parceiros</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="topbar">
    <div class="brand">
        <span class="brand-mark">OT</span>
        <span>Portal de Parcerias ORTODOA</span>
    </div>
</div>

<div class="container">

    <div class="header-row">
        <div>
            <h1>Pedidos de parceria</h1>
            <p>Analise os cadastros enviados pelas instituições parceiras.</p>
        </div>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button class="button secondary" type="submit">Sair</button>
        </form>
    </div>

    <div class="dashboard-grid">

        <div class="card metric-card">
            <span>Total</span>
            <strong th:text="${dashboard.total}">0</strong>
        </div>

        <div class="card metric-card success">
            <span>Aprovados</span>
            <strong th:text="${dashboard.aprovados}">0</strong>
        </div>

        <div class="card metric-card danger">
            <span>Reprovados</span>
            <strong th:text="${dashboard.reprovados}">0</strong>
        </div>

        <div class="card metric-card warning">
            <span>Pendentes</span>
            <strong th:text="${dashboard.pendentes}">0</strong>
        </div>

    </div>

    <div class="card">
        <h3>Resumo das solicitações</h3>

        <div id="statusChart" style="width: 100%; height: 380px;"></div>

        <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

        <script th:inline="javascript">
            const aprovados = [[${dashboard.aprovados}]];
            const reprovados = [[${dashboard.reprovados}]];
            const pendentes = [[${dashboard.pendentes}]];

            const chart = echarts.init(document.getElementById('statusChart'));

            const option = {
                tooltip: {
                    trigger: 'item'
                },

                legend: {
                    bottom: 0
                },

                series: [
                    {
                        name: 'Status das solicitações',
                        type: 'pie',
                        radius: ['40%', '70%'],

                        data: [
                            {
                                value: aprovados,
                                name: 'Aprovados',
                                itemStyle: { color: '#22c55e' }
                            },

                            {
                                value: reprovados,
                                name: 'Reprovados',
                                itemStyle: { color: '#ef4444' }
                            },

                            {
                                value: pendentes,
                                name: 'Pendentes',
                                itemStyle: { color: '#facc15' }
                            }
                        ]
                    }
                ]
            };

            chart.setOption(option);

            window.addEventListener('resize', function () {
                chart.resize();
            });
        </script>


    </div>

    <div class="card table-card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Instituição</th>
                <th>Status</th>
                <th>Login</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="partner : ${partners}">
                <td th:text="${partner.id}"></td>

                <td th:text="${partner.institutionName}"></td>

                <td>
                    <span class="badge"
                          th:classappend="${partner.status.name() == 'APROVADO' ? ' badge-success' : (partner.status.name() == 'REPROVADO' ? ' badge-danger' : ' badge-warning')}"
                          th:text="${partner.status.name() == 'PENDENTE' ? 'APROVAÇÃO PENDENTE' : partner.status}">
                    </span>
                </td>

                <td th:text="${partner.userAccount.username}"></td>

                <td>
                    <a class="link-action"
                       th:href="@{'/admin/parceiros/' + ${partner.id}}">
                        Ver detalhes
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
