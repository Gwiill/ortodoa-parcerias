<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Instituição | Painel</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="topbar"><div class="brand"><span class="brand-mark">HC</span><span>Portal de Parcerias ORTODOA</span></div></div>
<div class="container narrow-wide">
    <div class="header-row"><div><h1>Painel da instituição</h1><p th:text="${partner.institutionName}"></p></div><form th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Sair</button></form></div>
    <div class="status-panel" th:classappend="${partner.status.name() == 'APROVADO' ? ' status-success' : (partner.status.name() == 'REPROVADO' ? ' status-danger' : ' status-warning')}">
        <span>Status do pedido</span>
        <strong th:text="${partner.status.name() == 'PENDENTE' ? 'APROVAÇÃO PENDENTE' : partner.status}"></strong>
    </div>
    <div class="card details-grid">
        <p><strong>Login:</strong> <span th:text="${partner.userAccount.username}"></span></p>
        <p><strong>Responsável:</strong> <span th:text="${partner.responsibleName}"></span></p>
        <p><strong>E-mail:</strong> <span th:text="${partner.email}"></span></p>
        <p><strong>Telefone:</strong> <span th:text="${partner.phone}"></span></p>
        <p><strong>Cidade/UF:</strong> <span th:text="${partner.city + ' / ' + partner.state}"></span></p>
        <p><strong>CNPJ:</strong> <span th:text="${partner.cnpj}"></span></p>
        <p class="full-width"><strong>Mensagem do administrador:</strong> <span th:text="${partner.adminNote != null ? partner.adminNote : 'Sua solicitação ainda está em aprovação pendente.'}"></span></p>
        <p class="full-width"><strong>Motivo enviado no formulário:</strong> <span th:text="${partner.partnershipReason}"></span></p>
    </div>
</div>
</body></html>
